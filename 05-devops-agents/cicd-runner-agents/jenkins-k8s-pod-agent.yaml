apiVersion: v1
kind: Pod
metadata:
  name: jenkins-enterprise-agent
  namespace: jenkins-agents
  labels:
    role: jenkins-dynamic-agent
spec:
  serviceAccountName: jenkins-agent-sa
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001
  containers:
    - name: jnlp
      image: jenkins/inbound-agent:3192.v713e3b_039fb_e-1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
    
    # Custom Hardened Execution Container
    - name: tools
      image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/devops/hardened-runner:v1.0.0
      command: ["cat"]
      tty: true
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "4"
          memory: "8Gi"
      volumeMounts:
        - name: agent-cache
          mountPath: /home/runner/.cache

  volumes:
    - name: agent-cache
      emptyDir: {}

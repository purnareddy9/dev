name: Python Enterprise CI Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'services/python-app/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/python-app/**'

defaults:
  run:
    working-directory: services/python-app

jobs:
  lint-and-test:
    name: Lint, Test & Security Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: services/python-app/requirements*.txt

      - name: Install Tooling & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov bandit safety
          pip install -r requirements.txt

      - name: Linting with Ruff (Blazing fast Rust linter)
        run: ruff check .

      - name: Security Scan with Bandit (SAST)
        run: bandit -r app/ -ll

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=85 tests/

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: python-coverage
          path: services/python-app/coverage.xml

name: Golang Enterprise CI Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'services/go-app/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/go-app/**'

defaults:
  run:
    working-directory: services/go-app

jobs:
  lint-and-test:
    name: Lint, Test & Race Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache-dependency-path: services/go-app/go.sum

      - name: Golangci-lint Static Analysis
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.56
          working-directory: services/go-app

      - name: Run Tests with Race Detector (-race)
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Verify Go Module Tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum is not tidy!" && exit 1)

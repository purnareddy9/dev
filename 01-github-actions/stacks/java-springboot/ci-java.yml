name: Java Spring Boot Enterprise CI Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'services/java-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/java-service/**'

defaults:
  run:
    working-directory: services/java-service

jobs:
  build-and-test:
    name: Maven Compile, Test & JaCoCo Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Maven Tests with JaCoCo Coverage
        run: |
          mvn clean verify -B

      - name: Validate Quality Gate / JaCoCo Enforce
        run: |
          mvn jacoco:check -B

      - name: Publish Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: services/java-service/target/surefire-reports/

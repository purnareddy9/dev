name: Monorepo Smart Matrix Pipeline

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'services/**'
      - '.github/workflows/monorepo-smart-build.yml'

jobs:
  detect-changes:
    name: Filter Changed Microservices
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth-service:
              - 'services/auth/**'
            payment-service:
              - 'services/payment/**'
            notification-service:
              - 'services/notification/**'

  build-microservices:
    name: Build & Test Changed Services
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Don't cancel other matrix jobs if one fails
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Service Pipeline
        run: |
          echo "Processing changed service: ${{ matrix.service }}"
          SERVICE_DIR="services/${{ matrix.service }}"
          if [ -f "$SERVICE_DIR/package.json" ]; then
            cd "$SERVICE_DIR"
            echo "Building Node.js service..."
          elif [ -f "$SERVICE_DIR/go.mod" ]; then
            cd "$SERVICE_DIR"
            echo "Building Golang service..."
          fi

name: Container Security Scanning & Cosign Signing

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write  # Crucial for Cosign keyless signing via Sigstore / OIDC

jobs:
  security-and-signing:
    name: Scan, Generate SBOM & Sign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository }}/app:${{ github.sha }}

      - name: Scan Image with Trivy (Vulnerability Assessment)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/app:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # Fails the pipeline if CRITICAL CVEs are found

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.4.0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Container to GHCR
        run: docker push ghcr.io/${{ github.repository }}/app:${{ github.sha }}

      - name: Sign Container Image (Keyless Sigstore)
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/app:${{ github.sha }}

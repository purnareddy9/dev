apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: payment-production
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: eso-irsa-serviceaccount
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payment-gateway-database-secret
  namespace: payment-production
spec:
  refreshInterval: "1h" # Automatically detects and syncs rotated passwords
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: db-credentials-secret # Name of the generated native K8s Secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: production/payment/aurora
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: production/payment/aurora
        property: password

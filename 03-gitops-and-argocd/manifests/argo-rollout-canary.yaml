apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: order-processing-service
  namespace: ordering-prod
spec:
  replicas: 10
  strategy:
    canary:
      analysis:
        templates:
          - templateName: success-rate-prometheus
        args:
          - name: service-name
            value: order-processing-service
      steps:
        # Step 1: Route 10% traffic to canary pods
        - setWeight: 10
        - pause: { duration: 5m }
        # Step 2: Route 30% traffic to canary pods
        - setWeight: 30
        - pause: { duration: 10m }
        # Step 3: Route 60% traffic to canary pods
        - setWeight: 60
        - pause: { duration: 10m }
        # Step 4: Full promotion to 100%
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: order-processing-service
  template:
    metadata:
      labels:
        app: order-processing-service
    spec:
      containers:
        - name: app
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/order-processing:v3.1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-prometheus
  namespace: ordering-prod
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      interval: 30s
      successCondition: result[0] >= 0.995 # 99.5% success rate required
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-k8s.monitoring.svc:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}",status!~"5.*"}[2m]))
            /
            sum(rate(http_requests_total{service="{{args.service-name}}"}[2m]))

name: Real-Time AI Market & Cloud Provider Analyst Agent

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Stock Ticker Symbol to Analyze (e.g. NVDA, GOOGL, MSFT, AAPL, AMZN)'
        required: true
        default: 'NVDA'
  # Runs automatically at 9:30 AM EST (Market Open) Monday through Friday
  schedule:
    - cron: '30 14 * * 1-5'

permissions:
  contents: write

jobs:
  run-ai-analyst-agent:
    name: Execute Real-Time AI Market Agent
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Real-Time AI Market Intelligence Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "🚀 Executing AI Agent for ticker: ${{ github.event.inputs.ticker || 'NVDA' }}"
          python -u 09-github-actions-ai-agent/market_agent.py "${{ github.event.inputs.ticker || 'NVDA' }}"
          echo "=========================================================="
          echo "📄 GENERATED REPORT OUTPUT:"
          echo "=========================================================="
          cat 09-github-actions-ai-agent/market_report.md

      - name: Commit and Push Market Intelligence to GitHub
        run: |
          echo "📦 Staging generated market intelligence files..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market-intelligence/
          if git diff --staged --quiet; then
            echo "ℹ️ No market intelligence changes to commit."
          else
            git commit -m "chore(market-agent): autonomous intelligence update for ${{ github.event.inputs.ticker || 'NVDA' }} [$(date +'%Y-%m-%d')]"
            git pull --rebase origin main
            git push origin main
            echo "🚀 Successfully pushed updated market reports and historical archives to GitHub repository!"
          fi

      - name: Archive Analysis Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-analysis-${{ github.event.inputs.ticker || 'NVDA' }}
          path: |
            market-intelligence/
            09-github-actions-ai-agent/market_report.md
            09-github-actions-ai-agent/*.py

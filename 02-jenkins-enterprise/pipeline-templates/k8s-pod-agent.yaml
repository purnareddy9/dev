apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins: agent
    tier: dynamic-builder
spec:
  serviceAccountName: jenkins-agent-sa
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
  containers:
    - name: jnlp
      image: jenkins/inbound-agent:3192.v713e3b_039fb_e-1
      resources:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"

    - name: maven
      image: maven:3.9.6-eclipse-temurin-21
      command: ["cat"]
      tty: true
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      volumeMounts:
        - name: m2-cache
          mountPath: /root/.m2/repository

    - name: kaniko
      image: gcr.io/kaniko-project/executor:v1.20.0-debug
      command: ["cat"]
      tty: true
      securityContext:
        runAsUser: 0  # Kaniko unpacks filesystem in its own container
      resources:
        requests:
          cpu: "1"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "2Gi"

    - name: trivy
      image: aquasec/trivy:0.49.1
      command: ["cat"]
      tty: true

  volumes:
    - name: m2-cache
      persistentVolumeClaim:
        claimName: jenkins-maven-cache-pvc

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="260">
  <defs>
    <!-- Dark Tech Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .node-card { rx: 10px; fill: url(#cardGrad); stroke: #30363d; stroke-width: 1.5px; transition: all 0.3s; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #f0f6fc; }
      .node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; font-size: 10px; fill: #8b949e; }
      .flow-path { fill: none; stroke: #30363d; stroke-width: 3px; stroke-dasharray: 6 6; }
      
      /* Animated Packet Flow */
      .packet {
        fill: #58a6ff;
        filter: url(#glow);
        animation: travel 4s linear infinite;
      }
      
      .pulse-circle {
        animation: pulse 2s ease-in-out infinite alternate;
      }

      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.7; }
        100% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 6px #2ea043); }
      }

      @keyframes travel {
        0% { cx: 90; cy: 130; }
        20% { cx: 250; cy: 130; }
        40% { cx: 410; cy: 130; }
        60% { cx: 570; cy: 130; }
        80% { cx: 730; cy: 130; }
        100% { cx: 870; cy: 130; }
      }

      .badge-pass { fill: #238636; rx: 4px; }
      .badge-text { font-family: monospace; font-size: 9px; fill: #ffffff; font-weight: bold; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="260" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Connecting Bus Line -->
  <line x1="90" y1="130" x2="870" y2="130" class="flow-path"/>

  <!-- Animated Flying Data Packet -->
  <circle class="packet" r="6" cy="130" cx="90" />

  <!-- Node 1: Code Push -->
  <g transform="translate(30, 75)">
    <rect width="120" height="110" class="node-card" stroke="#58a6ff"/>
    <circle cx="60" cy="30" r="14" fill="#1f6feb" opacity="0.3"/>
    <text x="60" y="34" text-anchor="middle" font-size="16">💻</text>
    <text x="60" y="62" text-anchor="middle" class="node-title">1. Git Push</text>
    <text x="60" y="78" text-anchor="middle" class="node-sub">Branch &amp; PR Webhook</text>
    <rect x="25" y="88" width="70" height="14" class="badge-pass"/>
    <text x="60" y="98" text-anchor="middle" class="badge-text">SEMVER v2.1</text>
  </g>

  <!-- Node 2: CI Matrix Test -->
  <g transform="translate(190, 75)">
    <rect width="120" height="110" class="node-card"/>
    <circle cx="60" cy="30" r="14" fill="#a371f7" opacity="0.3"/>
    <text x="60" y="34" text-anchor="middle" font-size="16">🧪</text>
    <text x="60" y="62" text-anchor="middle" class="node-title">2. Polyglot CI</text>
    <text x="60" y="78" text-anchor="middle" class="node-sub">Node/Go/Py/Java</text>
    <rect x="25" y="88" width="70" height="14" class="badge-pass"/>
    <text x="60" y="98" text-anchor="middle" class="badge-text">TESTS PASS</text>
  </g>

  <!-- Node 3: Build & Cache -->
  <g transform="translate(350, 75)">
    <rect width="120" height="110" class="node-card"/>
    <circle cx="60" cy="30" r="14" fill="#388bfd" opacity="0.3"/>
    <text x="60" y="34" text-anchor="middle" font-size="16">📦</text>
    <text x="60" y="62" text-anchor="middle" class="node-title">3. Multi-Stage</text>
    <text x="60" y="78" text-anchor="middle" class="node-sub">BuildKit &amp; Cache</text>
    <rect x="25" y="88" width="70" height="14" class="badge-pass"/>
    <text x="60" y="98" text-anchor="middle" class="badge-text">DISTROLESS</text>
  </g>

  <!-- Node 4: Security & Sign -->
  <g transform="translate(510, 75)">
    <rect width="120" height="110" class="node-card"/>
    <circle cx="60" cy="30" r="14" fill="#e3b341" opacity="0.3"/>
    <text x="60" y="34" text-anchor="middle" font-size="16">🛡️</text>
    <text x="60" y="62" text-anchor="middle" class="node-title">4. Scan &amp; Sign</text>
    <text x="60" y="78" text-anchor="middle" class="node-sub">Trivy + Cosign</text>
    <rect x="25" y="88" width="70" height="14" class="badge-pass"/>
    <text x="60" y="98" text-anchor="middle" class="badge-text">ZERO CVEs</text>
  </g>

  <!-- Node 5: GitOps Sync (ArgoCD) -->
  <g transform="translate(670, 75)">
    <rect width="120" height="110" class="node-card"/>
    <circle cx="60" cy="30" r="14" fill="#f0883e" opacity="0.3"/>
    <text x="60" y="34" text-anchor="middle" font-size="16">🐙</text>
    <text x="60" y="62" text-anchor="middle" class="node-title">5. ArgoCD Pull</text>
    <text x="60" y="78" text-anchor="middle" class="node-sub">Git Reconcile Loop</text>
    <rect x="25" y="88" width="70" height="14" class="badge-pass"/>
    <text x="60" y="98" text-anchor="middle" class="badge-text">SYNCED</text>
  </g>

  <!-- Node 6: Progressive Rollout (K8s) -->
  <g transform="translate(810, 75)">
    <rect width="120" height="110" class="node-card" stroke="#2ea043"/>
    <circle cx="60" cy="30" r="14" fill="#2ea043" opacity="0.3"/>
    <text x="60" y="34" text-anchor="middle" font-size="16">☸️</text>
    <text x="60" y="62" text-anchor="middle" class="node-title">6. Production</text>
    <text x="60" y="78" text-anchor="middle" class="node-sub">Canary Analysis</text>
    <rect x="25" y="88" width="70" height="14" class="badge-pass"/>
    <text x="60" y="98" text-anchor="middle" class="badge-text">PROMOTED 100%</text>
  </g>

  <!-- Header Branding -->
  <text x="40" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#58a6ff">ENTERPRISE END-TO-END CI/CD/GITOPS AUTOMATION PIPELINE</text>
  <text x="40" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11" fill="#8b949e">Zero-Trust Event Pipeline • SLSA Provenance • Ephemeral Compute • Real-Time GitOps Reconciliation</text>
</svg>

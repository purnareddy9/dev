<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="300">
  <defs>
    <linearGradient id="bgAgent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="50%" stop-color="#ff0080" />
      <stop offset="100%" stop-color="#0070f3" />
    </linearGradient>

    <filter id="agentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .card { rx: 8px; fill: #161b22; stroke: #30363d; stroke-width: 1.5px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #ffffff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #8b949e; }
      .agent-core {
        animation: pulseAgent 3s ease-in-out infinite alternate;
        transform-origin: 480px 150px;
      }
      @keyframes pulseAgent {
        0% { transform: scale(0.97); filter: drop-shadow(0 0 6px rgba(121, 40, 202, 0.4)); }
        100% { transform: scale(1.03); filter: drop-shadow(0 0 16px rgba(0, 112, 243, 0.8)); }
      }
      .signal {
        stroke-dasharray: 6 6;
        animation: dashFlow 2s linear infinite;
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      .badge { rx: 4px; font-family: monospace; font-size: 9px; font-weight: bold; }
    </style>
  </defs>

  <rect width="960" height="300" rx="12" fill="url(#bgAgent)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Connecting Signal Lines to Agent Core -->
  <line x1="220" y1="95" x2="400" y2="150" stroke="#58a6ff" stroke-width="2" class="signal"/>
  <line x1="220" y1="215" x2="400" y2="150" stroke="#e3b341" stroke-width="2" class="signal"/>
  
  <line x1="560" y1="150" x2="740" y2="95" stroke="#2ea043" stroke-width="2" class="signal"/>
  <line x1="560" y1="150" x2="740" y2="215" stroke="#a371f7" stroke-width="2" class="signal"/>

  <!-- Left Top Box: Observability / Webhook Triggers -->
  <g transform="translate(40, 45)">
    <rect width="180" height="95" class="card" stroke="#58a6ff"/>
    <text x="15" y="28" class="title" fill="#58a6ff">📡 1. Signals &amp; Events</text>
    <text x="15" y="48" class="subtitle">• GitHub Webhook / Job Queue</text>
    <text x="15" y="65" class="subtitle">• Prometheus Alert / Datadog 5xx</text>
    <text x="15" y="82" class="subtitle">• K8s Pod CrashLoopBackOff</text>
  </g>

  <!-- Left Bottom Box: Tooling & Environment Context -->
  <g transform="translate(40, 165)">
    <rect width="180" height="95" class="card" stroke="#e3b341"/>
    <text x="15" y="28" class="title" fill="#e3b341">🧰 2. Agent Execution Tools</text>
    <text x="15" y="48" class="subtitle">• Kubectl, Helm, Terraform CLI</text>
    <text x="15" y="65" class="subtitle">• Git CLI &amp; GitHub REST API</text>
    <text x="15" y="82" class="subtitle">• AWS IAM OIDC / Cloud SDKs</text>
  </g>

  <!-- Center Hub: The DevOps Agent Controller -->
  <g class="agent-core">
    <circle cx="480" cy="150" r="70" fill="#161b22" stroke="url(#agentGrad)" stroke-width="3.5"/>
    <text x="480" y="130" text-anchor="middle" font-size="28">🤖</text>
    <text x="480" y="155" text-anchor="middle" class="title" font-size="13">DEVOPS AGENT</text>
    <text x="480" y="172" text-anchor="middle" class="subtitle" fill="#58a6ff">ReAct Reasoning Loop</text>
    <text x="480" y="186" text-anchor="middle" font-size="9" fill="#8b949e">Observe • Decide • Act</text>
  </g>

  <!-- Right Top Box: Autonomous Triage & Actions -->
  <g transform="translate(740, 45)">
    <rect width="180" height="95" class="card" stroke="#2ea043"/>
    <text x="15" y="28" class="title" fill="#2ea043">⚡ 3. Autonomous Execution</text>
    <text x="15" y="48" class="subtitle">• Ephemeral K8s Pod Spin-up</text>
    <text x="15" y="65" class="subtitle">• Daemonless Container Build</text>
    <text x="15" y="82" class="subtitle">• Auto-PR for Failed Tests</text>
  </g>

  <!-- Right Bottom Box: Remediation & GitOps Reconciliation -->
  <g transform="translate(740, 165)">
    <rect width="180" height="95" class="card" stroke="#a371f7"/>
    <text x="15" y="28" class="title" fill="#a371f7">🛡️ 4. Guardrails &amp; Self-Heal</text>
    <text x="15" y="48" class="subtitle">• ArgoCD Sync / Auto Rollback</text>
    <text x="15" y="65" class="subtitle">• Least Privilege IAM Scoping</text>
    <text x="15" y="82" class="subtitle">• Human Approval Gate for Prod</text>
  </g>

  <!-- Title Header -->
  <text x="40" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#f0883e">DEVOPS AGENT PARADIGM: RUNNER INFRASTRUCTURE &amp; AI INCIDENT AGENTS</text>
</svg>
